<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Referral Tier Analytics</title>
<link rel="icon" type="image/png" href="sse-logo.png"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg:   #f4f3ef;
    --sur:  #ffffff;
    --bd:   rgba(0,0,0,0.10);
    --txt:  #1a1a18;
    --mu:   #6b6b67;
    --r:    10px;
    /* Brand palette */
    --brand-navy:#131ca2; --brand-blue:#00bdff; --brand-gold:#FFC100;
    --accent: var(--brand-blue); --accent-hover: var(--brand-navy);
    --tc-platinum:#c084fc; --tc-gold:#f59e0b; --tc-silver:#94a3b8;
    --tc-bronze:#b87333;   --tc-stones:#78716c; --tc-sticks:#78350f;
    --tc-metals: var(--brand-gold);
    --topbar-h: 57px; /* fallback; JS measures the real height on load/resize */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;
       background:var(--bg);color:var(--txt);min-height:100vh}

  /* ── TOP BAR ─────────────────────────────────────── */
  .topbar{background:var(--sur);border-bottom:0.5px solid var(--bd);
          padding:12px 24px;display:flex;align-items:center;
          justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
  .logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
  .logo-img{height:24px;width:auto;flex-shrink:0}
  .meta-info{font-size:11px;color:var(--mu)}
  .topbar-right{display:flex;align-items:center;gap:10px}
  select,button{border:0.5px solid var(--bd);background:var(--sur);color:var(--txt);
                padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px}
  button:hover,select:hover{background:var(--bg)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover{background:var(--accent-hover)}

  /* ── VIEW-MODE TOGGLE ────────────────────────────── */
  .seg-toggle{display:flex;border:0.5px solid var(--bd);border-radius:7px;overflow:hidden;flex-shrink:0}
  .seg-toggle button{border:0;border-radius:0;padding:5px 10px;font-size:11px}
  .seg-toggle button.on{background:var(--accent);color:#fff;font-weight:500}

  /* ── APP SHELL (sidebar + tab content) ───────────── */
  .app-shell{max-width:1280px;margin:0 auto;display:flex;align-items:flex-start}
  .sidebar{position:sticky;top:var(--topbar-h);flex-shrink:0;width:200px;
           padding:20px 12px;display:flex;flex-direction:column;gap:2px;
           max-height:calc(100vh - var(--topbar-h));overflow-y:auto}
  .nav-item{padding:9px 14px;border-radius:7px;font-size:13px;color:var(--txt);
            cursor:pointer;user-select:none;white-space:nowrap}
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--accent);color:#fff;font-weight:500}
  .main{flex:1;min-width:0}
  .content-header{position:sticky;top:var(--topbar-h);z-index:40;background:var(--bg);
                  padding:14px 24px 12px;font-size:15px;font-weight:600;
                  border-bottom:0.5px solid var(--bd)}

  /* ── LAYOUT ──────────────────────────────────────── */
  .page{max-width:1080px;padding:20px 24px;display:flex;flex-direction:column;gap:16px}

  /* ── METRIC CARDS ────────────────────────────────── */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .met{background:var(--bg);border-radius:8px;padding:12px 14px}
  .met-lbl{font-size:11px;color:var(--mu);margin-bottom:4px}
  .met-val{font-size:24px;font-weight:500;letter-spacing:-.5px}
  .met-sub{font-size:10px;color:var(--mu);margin-top:2px}

  /* ── CARDS ───────────────────────────────────────── */
  .card{background:var(--sur);border:0.5px solid var(--bd);border-radius:var(--r);padding:18px 20px}
  .card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
  .card-t{font-size:13px;font-weight:500}
  .card-s{font-size:11px;color:var(--mu);margin-top:2px}
  .card-actions{display:flex;gap:6px;flex-shrink:0}

  /* ── TIER LEGEND ─────────────────────────────────── */
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .lc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}
  .ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

  /* ── MOM BARS ────────────────────────────────────── */
  .mom{display:flex;flex-direction:column;gap:8px}
  .mom-row{display:flex;align-items:center;gap:10px}
  .mom-lbl{font-size:11px;color:var(--mu);width:52px;text-align:right;flex-shrink:0}
  .mom-bar{flex:1;height:28px;border-radius:6px;overflow:hidden;display:flex;background:var(--bg)}
  .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;
       color:rgba(255,255,255,.9);overflow:hidden;white-space:nowrap;transition:width .4s ease}
  .mom-tot{font-size:11px;color:var(--mu);width:42px;text-align:left;flex-shrink:0}

  /* ── TIER TABLE ──────────────────────────────────── */
  .ttbl{width:100%;border-collapse:collapse;font-size:12px}
  .ttbl th{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;
           color:var(--mu);padding:6px 8px;text-align:left;border-bottom:0.5px solid var(--bd)}
  .ttbl td{padding:7px 8px;border-bottom:0.5px solid var(--bd)}
  .ttbl tr:last-child td{border-bottom:none}
  .ttbl.roomy th{padding:10px 12px;font-size:10.5px}
  .ttbl.roomy td{padding:13px 12px;font-size:13px}
  .th-sub{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:var(--mu);margin-top:2px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:500;color:#fff}
  .pp-dec{color:#b91c1c}
  .pp-inc{color:#15803d}
  .pp-flat{color:var(--mu)}
  .hbtbl td[title]{cursor:help;text-decoration:underline dotted;text-decoration-color:var(--bd);text-underline-offset:3px}
  .ttbl tr.summary-row td{font-weight:600;border-top:1.5px solid var(--txt)}
  .ttbl tr.india-row td{font-weight:600;background:var(--bg);border-bottom:1.5px solid var(--txt)}
  .pp-sub{font-size:10px;font-weight:400;opacity:.85}

  /* ── TREND CHART ─────────────────────────────────── */
  .chart-wrap{position:relative;height:260px}

  /* ── SSEID TABLE ─────────────────────────────────── */
  .search-row{display:flex;gap:8px;margin-bottom:10px}
  .search-row input,.search-row select{
    flex:1;border:0.5px solid var(--bd);background:var(--sur);color:var(--txt);
    padding:6px 10px;border-radius:7px;font-size:12px;outline:none}
  .search-row input:focus,.search-row select:focus{border-color:var(--accent)}
  .dtbl-wrap{overflow-x:auto;max-height:380px;overflow-y:auto}
  .dtbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
  .dtbl th{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;
           color:var(--mu);padding:6px 8px;text-align:left;background:var(--sur);
           position:sticky;top:0;border-bottom:0.5px solid var(--bd)}
  .dtbl td{padding:6px 8px;border-bottom:0.5px solid var(--bd);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dtbl tr:last-child td{border-bottom:none}
  .dtbl tr:hover td{background:var(--bg)}

  /* ── EMPTY / LOADING ─────────────────────────────── */
  .loading{display:flex;align-items:center;justify-content:center;padding:48px;
           color:var(--mu);font-size:13px;gap:8px}
  .spinner{width:16px;height:16px;border:2px solid var(--bd);
           border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-box{background:#fcebeb;border:0.5px solid rgba(162,45,45,.3);color:#a32d2d;
           border-radius:8px;padding:12px 16px;font-size:12px}

  /* ── COHORT ACTIVATION HEATMAP ────────────────────── */
  .seg-toggle.sm button{padding:4px 10px;font-size:11px}
  .seg-toggle button:disabled{opacity:.45;cursor:not-allowed}
  table.hm td{text-align:center;font-family:'Courier New',monospace;cursor:default}
  table.hm td.rl{text-align:left;font-family:inherit;font-weight:500;background:var(--bg);
                 border-right:1.5px solid var(--bd);white-space:nowrap}
  table.hm td.sc{text-align:right;color:var(--mu);background:var(--bg);border-right:0.5px solid var(--bd)}
  table.hm tr.era-row td{background:var(--bg);font-size:10px;font-weight:700;color:var(--mu);
                          text-transform:uppercase;letter-spacing:.06em;text-align:left;padding-left:10px}
  .noise-flag{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brand-gold);
              vertical-align:super;margin-left:2px}
  .hm-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--mu)}
  .leg-bar{height:10px;width:140px;border-radius:3px;overflow:hidden;display:flex}
  .ctog-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .ctog{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;border:1.5px solid var(--bd);
        background:var(--sur);color:var(--mu);cursor:pointer;transition:all .12s}

  /* ── RECONCILIATION FOOTNOTE ─────────────────────── */
  .recon{font-size:11px;color:var(--mu);margin-top:10px;padding-top:10px;
         border-top:0.5px dashed var(--bd)}
  .recon b{color:var(--txt);font-weight:500}
  .recon.ok::before{content:"✓ ";color:#15803d}
  .recon.bad::before{content:"⚠ ";color:#b91c1c}

  /* ── MONTH-TO-DATE CARD ──────────────────────────── */
  .mtd-card{border-left:3px solid var(--accent)}
  .mtd-card .card-t::after{content:"IN PROGRESS";margin-left:8px;font-size:9px;
    font-weight:600;letter-spacing:.5px;color:var(--accent-hover);
    background:rgba(0,189,255,.12);padding:2px 7px;border-radius:10px;vertical-align:2px}

  /* ── CITY CHART GRID ─────────────────────────────── */
  .city-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .city-card{background:var(--sur);border:0.5px solid var(--bd);border-radius:var(--r);padding:14px 16px}
  .city-name{font-size:12px;font-weight:500;margin-bottom:10px}
  .city-bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--bg);margin-bottom:6px}
  .city-stat{display:flex;justify-content:space-between;font-size:10px;color:var(--mu)}

  @media(max-width:900px){
    .app-shell{flex-direction:column}
    .sidebar{position:static;width:100%;max-height:none;flex-direction:row;
             flex-wrap:wrap;padding:12px 24px 0}
    .content-header{top:0}
  }
  @media(max-width:640px){
    .page{padding:12px 14px}
    .topbar{padding:10px 14px}
    .metrics{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <img src="sse-logo.png" alt="SSE" class="logo-img"/>
    Referral Tier Analytics
  </div>
  <div class="topbar-right">
    <span class="meta-info" id="metaInfo">Loading…</span>
    <div class="seg-toggle" id="viewToggle">
      <button class="on" data-mode="full" onclick="setViewMode('full')">6-Tier</button>
      <button data-mode="metals" onclick="setViewMode('metals')">Sticks/Stones/Metals</button>
    </div>
    <select id="cityFilter" onchange="applyFilters()"><option value="">All cities</option></select>
    <select id="tierFilter" onchange="applyFilters()">
      <option value="">All tiers</option>
      <option>Platinum</option><option>Gold</option><option>Silver</option>
      <option>Bronze</option><option>Stones</option><option>Sticks</option>
    </select>
    <button class="primary" onclick="exportCSV()">↓ Export CSV</button>
  </div>
</div>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="content-header" id="contentHeader"></div>
    <div class="page" id="page">
      <div class="loading"><div class="spinner"></div>Loading dashboard data…</div>
    </div>
  </div>
</div>

<script>
const TIER_ORDER = ["Platinum","Gold","Silver","Bronze","Stones","Sticks"];
// Note: Stones/Sticks are shifted from the brief's canonical hex values here
// (display-only) so they're distinguishable from Silver's blue-gray. etl.py's
// TIER_COLORS (written into data/*.json meta) keeps the original values.
const TIER_COLORS = {
  Platinum:"#c084fc",Gold:"#f59e0b",Silver:"#94a3b8",
  Bronze:"#b87333",Stones:"#78716c",Sticks:"#78350f"
};
const TIER_CONDITIONS = {
  Platinum:"≥ 12 referral orders",Gold:"7–11 referral orders",
  Silver:"3–6 referral orders",Bronze:"1–2 referral orders",
  Stones:"≥ 1 lead, 0 orders",Sticks:"0 leads, 0 orders"
};
const METALS_TIERS = ["Bronze","Silver","Gold","Platinum"];
const METALS_COLOR = "#FFC100"; // brand gold

let DATA = { mom: null, sseid: null, meta: null, heldbase: null, mtd: null, cohort: null };
let viewMode = "full"; // "full" | "metals"
let numberMode = "pct"; // "pct" | "abs" — switches how tables 1-3 display each cell
let trendChart = null;
let cityTrendChart = null;

function setNumberMode(mode) {
  numberMode = mode;
  document.querySelectorAll("#numToggle button").forEach(b => {
    b.classList.toggle("on", b.dataset.mode === mode);
  });
  applyFilters();
}

// ── COHORT ACTIVATION TAB ────────────────────────────────────────────────────
// A cohort here = customers commissioned in the same FISCAL quarter (Apr–Mar),
// a fixed group forever — unlike the monthly held-base cohorts elsewhere in
// this dashboard, which roll forward every month. Tracks, for a trailing
// window of calendar months, what tier each cohort member was sitting in as
// of that month's START, and whether they gave >=1 referral lead DURING that
// month ("activation"). Never shows the in-progress month — same rule as
// everywhere else in this dashboard.
const COHORT_TIER_GROUPS = {
  Sticks:   ["Sticks"],
  Stones:   ["Stones"],
  Bronze:   ["Bronze"],
  Silver:   ["Silver"],
  Gold:     ["Gold"],
  Platinum: ["Platinum"],
  Metals:   METALS_TIERS,
  Combined: TIER_ORDER,
};
const METAL_SUBS = ["Metals","Bronze","Silver","Gold","Platinum"];
let cohortSeg = "Sticks";       // Sticks | Stones | Metals | Bronze | Silver | Gold | Platinum | Combined
let cohortMetalSub = "Metals";  // which metal sub-tab was last picked, remembered across toggles
let cohortHmMode = "pct";       // "pct" | "act" | "pop"
let cohortActiveCohorts = new Set();
let cohortLineChart = null;

// The global Tier filter (topbar), when set, pins this tab to that exact
// tier — same rule as everywhere else that dropdown touches. Sticks/Stones
// map to their own segment; Bronze/Silver/Gold/Platinum map 1:1. Clearing
// the global filter hands control back to the tab's own segment buttons.
function cohortEffectiveSeg(tierFilter) {
  if (tierFilter) return tierFilter;
  if (viewMode === "metals" && METAL_SUBS.includes(cohortSeg) && cohortSeg !== "Metals") return "Metals";
  return cohortSeg;
}
function setCohortSeg(seg) {
  cohortSeg = seg;
  if (METAL_SUBS.includes(seg)) cohortMetalSub = seg;
  applyFilters();
}
function setCohortHmMode(mode) {
  cohortHmMode = mode;
  applyFilters();
}
function toggleCohortLine(cohort) {
  if (cohortActiveCohorts.has(cohort)) cohortActiveCohorts.delete(cohort);
  else cohortActiveCohorts.add(cohort);
  applyFilters();
}
// FY label ("FY24-25") from a cohort string ("Q4 FY24-25") — used to group
// cohorts into era-aggregate rows, one era per fiscal year.
function cohortEra(cohort) {
  const m = /FY\d{2}-\d{2}/.exec(cohort);
  return m ? m[0] : cohort;
}
// "2026-03" -> "Feb'26" — the calendar month immediately before `mo`, used
// to label the "also active last month" tooltip line without needing the
// displayed month array (works even for the window's first column, whose
// prior month isn't itself shown).
function prevMonthLabelOf(mo) {
  const [y, m] = mo.split("-").map(Number);
  const d = new Date(y, m - 2, 1);
  return d.toLocaleDateString("en-US", { month: "short" }) + "'" + String(d.getFullYear()).slice(-2);
}
// Aggregates cohort_activation.json's flat records into {cohort: {month: {pop,act}}}
// for one segment (already tier-grouped) and an optional city filter.
function buildCohortGrid(records, seg, cityFilter) {
  const wanted = new Set(COHORT_TIER_GROUPS[seg] || []);
  const grid = {};
  records.forEach(r => {
    if (cityFilter && r.city !== cityFilter) return;
    if (!wanted.has(r.tier)) return;
    const byMonth = grid[r.cohort] || (grid[r.cohort] = {});
    const cell = byMonth[r.month] || (byMonth[r.month] = { pop: 0, act: 0, repeatAct: 0, byTier: {} });
    cell.pop += r.pop;
    cell.act += r.act;
    cell.repeatAct += r.repeat_act || 0;
    // Keep the raw-tier split too — only meaningful when this segment blends
    // more than one raw tier (Metals, All Customers); the tooltip shows it
    // only then, since a single-tier view has nothing to break down.
    const bt = cell.byTier[r.tier] || (cell.byTier[r.tier] = { pop: 0, act: 0, repeatAct: 0 });
    bt.pop += r.pop; bt.act += r.act; bt.repeatAct += r.repeat_act || 0;
  });
  return grid;
}
// Same aggregation but ignoring tier entirely — used for the "Size" column,
// which is always the cohort's whole population, independent of which
// segment is currently selected.
function buildCohortSizeByLatestMonth(records, months, cityFilter) {
  const latest = months[months.length - 1];
  const sizes = {};
  records.forEach(r => {
    if (r.month !== latest) return;
    if (cityFilter && r.city !== cityFilter) return;
    sizes[r.cohort] = (sizes[r.cohort] || 0) + r.pop;
  });
  return sizes;
}
// How many of the cohort are Metals as of the MOST RECENT data we have —
// a stable "big picture" number, same anchor month as Size, shown in every
// cell's tooltip regardless of which month/segment you're actually hovering,
// specifically so it can't be mistaken for that cell's own (possibly
// still-forming, possibly non-Metals) Pool value.
function buildEngagedTillDate(records, months, cityFilter) {
  const latest = months[months.length - 1];
  const engaged = {};
  records.forEach(r => {
    if (r.month !== latest) return;
    if (cityFilter && r.city !== cityFilter) return;
    if (!METALS_TIERS.includes(r.tier)) return;
    engaged[r.cohort] = (engaged[r.cohort] || 0) + r.pop;
  });
  return engaged;
}
// Who moved into Metals (from Sticks or Stones) between last month-start
// and this month-start, for this fixed fiscal-quarter cohort. Needs
// "prior_tier" from the SQL (meta.has_prior_tier_data) — segment-independent,
// since it's a fact about the whole cohort, not about whichever tier/segment
// is currently selected.
function buildNewToMetalsBreakdown(records, cityFilter) {
  const grid = {};
  records.forEach(r => {
    if (cityFilter && r.city !== cityFilter) return;
    if (!METALS_TIERS.includes(r.tier)) return;
    if (!r.prior_tier || METALS_TIERS.includes(r.prior_tier)) return;   // already Metals last month too — not "new"
    const byMonth = grid[r.cohort] || (grid[r.cohort] = {});
    const cell = byMonth[r.month] || (byMonth[r.month] = { Sticks: 0, Stones: 0, total: 0 });
    cell[r.prior_tier] = (cell[r.prior_tier] || 0) + r.pop;
    cell.total += r.pop;
  });
  return grid;
}
function cohortPctToHex(pct, maxPct) {
  const t = Math.min(Math.max(maxPct > 0 ? pct / maxPct : 0, 0), 1);
  const stops = [[0,[244,244,242]],[.25,[209,250,229]],[.5,[110,231,183]],[.75,[0,189,255]],[1,[19,28,162]]];
  let rgb = [244,244,242];
  for (let i = 0; i < stops.length - 1; i++) {
    const [ta,ca] = stops[i], [tb,cb] = stops[i+1];
    if (t >= ta && t <= tb) { const f = (t-ta)/(tb-ta); rgb = ca.map((v,j) => v+(cb[j]-v)*f); break; }
  }
  return "#"+rgb.map(v => Math.round(v).toString(16).padStart(2,"0")).join("");
}
function cohortFgForBg(pct, maxPct) {
  return (maxPct > 0 ? pct/maxPct : 0) >= 0.6 ? "#fff" : "#1a1a18";
}

// ── VIEW MODE (6-tier vs Sticks/Stones/Metals) ──────────────────────────────
function activeTiers() {
  return viewMode === "metals" ? ["Sticks","Stones","Metals"] : TIER_ORDER;
}
function activeColor(t) {
  return t === "Metals" ? METALS_COLOR : TIER_COLORS[t];
}
// Brand gold (Metals) is too light for white badge text — use dark text on it
function badgeTextColor(t) {
  return t === "Metals" ? "#1a1a18" : "#fff";
}
// Collapses a {tier: count} map (6-tier keys) into the active view's buckets
function bucketize(byTier) {
  byTier = byTier || {};
  if (viewMode !== "metals") return byTier;
  const metals = METALS_TIERS.reduce((s,t) => s+(byTier[t]||0), 0);
  return { Sticks: byTier["Sticks"]||0, Stones: byTier["Stones"]||0, Metals: metals };
}
function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll("#viewToggle button").forEach(b => {
    b.classList.toggle("on", b.dataset.mode === mode);
  });
  applyFilters();
}

// ── TABS (left nav) ──────────────────────────────────────────────────────────
// Add new tabs here — each needs a matching `case` in renderAll()'s tab-content switch.
const TABS = [
  { id: "exec",   label: "Executive Summary" },
  { id: "trends", label: "Trends & MoM" },
  { id: "cohort", label: "Cohort Activation" },
  { id: "city",   label: "City Summary" },
  { id: "sseid",  label: "SSEID Detail" },
];
let activeTab = TABS[0].id;

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  if (!sb) return;
  sb.innerHTML = TABS.map(t =>
    `<div class="nav-item${t.id === activeTab ? " active" : ""}" onclick="setActiveTab('${t.id}')">${t.label}</div>`
  ).join("");

  if (hdr) hdr.textContent = TABS.find(t => t.id === activeTab)?.label || "";
}
function setActiveTab(id) {
  activeTab = id;

  applyFilters();
}

// ── FETCH ALL DATA ─────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [mom, sseid, meta, heldbase, mtd, cohort] = await Promise.all([
      fetch("data/tier_mom.json").then(r => r.json()),
      fetch("data/tier_sseid.json").then(r => r.json()),
      fetch("data/meta.json").then(r => r.json()),
      fetch("data/tier_heldbase_sseid.json").then(r => r.json()).catch(() => ({ meta: {}, records: [] })),
      fetch("data/tier_mtd.json").then(r => r.json()).catch(() => ({ meta: {}, mtd: null })),
      fetch("data/cohort_activation.json").then(r => r.json()).catch(() => ({ meta: {}, records: [] })),
    ]);
    DATA = { mom, sseid, meta, heldbase, mtd, cohort };
    cohortActiveCohorts = new Set((cohort.meta?.cohorts || []).slice(-10));

    // Populate city filter
    const cities = [...new Set([
      ...(mom.meta?.clusters || []),
      ...(sseid.meta?.cities || []),
      ...(cohort.meta?.cities || []),
    ])].sort();
    const cf = document.getElementById("cityFilter");
    cities.forEach(c => { const o = document.createElement("option"); o.value=c; o.textContent=c; cf.appendChild(o); });

    // Meta info
    const gi = meta.generated_at ? new Date(meta.generated_at).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",hour12:true}) : "";
    document.getElementById("metaInfo").textContent = `Updated ${gi} IST`;

    applyFilters();
  } catch(e) {
    document.getElementById("page").innerHTML =
      `<div class="err-box">Failed to load data. ${e.message}<br><br>
       Make sure the ETL has run at least once and <code>data/tier_mom.json</code> exists.<br>
       If running locally, serve this folder with a static server (e.g. <code>python -m http.server 8080</code>).</div>`;
  }
}

// ── FILTERS ────────────────────────────────────────────────────────────────
function applyFilters() {
  const city = document.getElementById("cityFilter").value;
  const tier = document.getElementById("tierFilter").value;
  renderAll(city, tier);
}

// ── MAIN RENDER ────────────────────────────────────────────────────────────
function renderAll(cityFilter, tierFilter) {
  const { mom, sseid, heldbase } = DATA;
  if (!mom || !sseid) return;

  if (trendChart) { trendChart.destroy(); trendChart = null; }
  if (cityTrendChart) { cityTrendChart.destroy(); cityTrendChart = null; }
  if (cohortLineChart) { cohortLineChart.destroy(); cohortLineChart = null; }

  const latestMonth = mom.months[mom.months.length - 1];

  // Filter MoM data by city
  function filterMomMonth(m) {
    if (!cityFilter) return m.by_tier;
    const bt = {};
    TIER_ORDER.forEach(t => {
      bt[t] = m.by_cluster_tier?.[`${cityFilter}|${t}`] || 0;
    });
    return bt;
  }
  function monthTotal(m) {
    return Object.values(filterMomMonth(m)).reduce((s,v) => s+v, 0);
  }

  // Filter SSEID rows
  let sseidRows = sseid.records || [];
  if (cityFilter) sseidRows = sseidRows.filter(r => r.city === cityFilter);
  if (tierFilter) sseidRows = sseidRows.filter(r => r.tier === tierFilter);
  window._filteredRows = sseidRows;

  // ── COHORT-BASED TIER METHODOLOGY (used everywhere in this dashboard) ──
  // "Current month" reporting never includes SSEIDs commissioned during that
  // same month. For month M, the base/cohort = every SSEID commissioned by
  // the END of month M-1 (fixed — it does not grow during M). Tier is
  // computed for that exact same cohort at two points: once as of M-1's end
  // (the baseline) and once as of M's end (current) — so numerator and
  // denominator are always the SAME fixed population, and %-share always
  // sums to 100% within a month. SSEIDs commissioned DURING month M are
  // excluded entirely from M's tier reporting; they first enter reporting
  // the FOLLOWING month, once M becomes the prior month for a new cohort.
  // They're tracked meanwhile as "New to base" (see the metric card below).
  function filterHeldBase(m) {
    const hb = m?.held_base;
    if (!hb) return null;
    if (!cityFilter) {
      return { prev: hb.by_tier_prev, curr: hb.by_tier_curr, base_size: hb.base_size };
    }
    const prev = {}, curr = {};
    TIER_ORDER.forEach(t => {
      prev[t] = hb.by_cluster_tier_prev?.[`${cityFilter}|${t}`] || 0;
      curr[t] = hb.by_cluster_tier_curr?.[`${cityFilter}|${t}`] || 0;
    });
    return { prev, curr, base_size: Object.values(curr).reduce((s,v)=>s+v,0) };
  }
  const cohortMonths = mom.months.filter(m => m.held_base); // every month except the first, which has no prior to cohort against
  const latestCohortMonth = cohortMonths[cohortMonths.length - 1];
  const latestCohort = latestCohortMonth ? filterHeldBase(latestCohortMonth) : null;
  const priorMonthLabel = latestCohortMonth ? mom.months[mom.months.indexOf(latestCohortMonth) - 1]?.label : latestMonth?.label;

  // {prev%, curr%, pp} per tier, for every cohort month — prev and curr both
  // divide into that SAME month's base_size, so it's always apples-to-apples.
  const pctByMonth = cohortMonths.map(m => {
    const hb = filterHeldBase(m);
    const prevB = bucketize(hb.prev), currB = bucketize(hb.curr);
    const pct = {};
    activeTiers().forEach(t => {
      const p = hb.base_size ? (prevB[t]||0)/hb.base_size*100 : 0;
      const c = hb.base_size ? (currB[t]||0)/hb.base_size*100 : 0;
      pct[t] = { prev: +p.toFixed(2), curr: +c.toFixed(2), pp: +(c-p).toFixed(2),
                 prevCount: prevB[t]||0, currCount: currB[t]||0 };
    });
    return pct;
  });

  // This month's leads/orders PROGRESS for the latest cohort — from the
  // SSEID-level held-base detail file (only available for the latest pair,
  // Jun→Jul in a 6-month window). Grouped by tier_prev (the baseline tier
  // established at the START of this month), so you can see e.g. "of the
  // June-30 Sticks, how much have THEY given so far in July" — directly
  // answering "how is this month performing so far."
  const hbRecords = heldbase?.records || [];
  const hbCityFiltered = cityFilter ? hbRecords.filter(r => r.city === cityFilter) : hbRecords;
  const hbTierFiltered = tierFilter ? hbRecords.filter(r => r.tier_prev === tierFilter) : hbRecords;
  // `sameFn`, when given, counts how many rows in each group still satisfy it
  // (used to show "Still Sticks" vs "Moved up" — tiers only ever move UP
  // within a month, since referral counts never decrease, so any SSEID whose
  // tier_curr differs from its tier_prev has strictly improved).
  function aggregateProgress(rows, keyFn, sameFn) {
    const byKey = {};
    rows.forEach(r => {
      const k = keyFn(r);
      if (!byKey[k]) byKey[k] = { count: 0, leadsPrev: 0, leadsCurr: 0, ordersPrev: 0, ordersCurr: 0, stillSame: 0 };
      const g = byKey[k];
      g.count++;
      g.leadsPrev += r.leads_prev; g.leadsCurr += r.leads_curr;
      g.ordersPrev += r.orders_prev; g.ordersCurr += r.orders_curr;
      if (sameFn && sameFn(r, k)) g.stillSame++;
    });
    return byKey;
  }
  const progressByTier = aggregateProgress(hbCityFiltered, r => r.tier_prev, (r,k) => r.tier_curr === k);
  const progressByCity = aggregateProgress(hbTierFiltered, r => r.city);
  const hbLabel = heldbase?.meta?.curr_label || latestCohortMonth?.label || "";
  const hbPrevLabel = heldbase?.meta?.prev_label || priorMonthLabel || "";

  // Color is direction-only (green=increase, red=decrease) so it reads consistently
  // across every row. Favorability (is this increase/decrease good news for this
  // tier?) is a separate, tier-aware judgment used only in the tooltip text.
  function dirClass(pp) {
    return pp > 0.05 ? "pp-inc" : pp < -0.05 ? "pp-dec" : "pp-flat";
  }
  function favorability(tier, pp) {
    if (Math.abs(pp) < 0.05) return "no real change";

  const latestCurrB = latestCohort ? bucketize(latestCohort.curr) : {};

           <div class="card-s">Tier distribution per city, cohort-based</div></div>
    </div>
    <div class="city-grid" id="cityGrid"></div>
  </div>
  ${hbRecords.length ? `
  <div class="card">
    <div class="card-hd">
      <div><div class="card-t">City-wise progress this month</div>
           <div class="card-s">Leads/orders given by ${hbLabel} = ${hbLabel} total minus ${hbPrevLabel} total, for this month's baseline cohort${tierFilter ? " · "+tierFilter+" only" : ""}</div></div>
    </div>
    <div class="dtbl-wrap" style="max-height:none">
      <table class="ttbl">
        <thead><tr>
          <th>City</th><th>Count</th>
          <th>Leads Till ${hbPrevLabel}</th><th>Leads in ${hbLabel}</th><th>Leads given</th>
          <th>Orders Till ${hbPrevLabel}</th><th>Orders in ${hbLabel}</th><th>Orders given</th>
        </tr></thead>
        <tbody id="cityProgressTbody"></tbody>
      </table>
    </div>
  </div>` : ""}` : `<div class="card">No cohort-based city breakdown available yet (need at least 2 months loaded).</div>`}
  `;

  const sseidHTML = `
  ${sseid.records?.length ? `
  <div class="card">
    <div class="card-hd">
      <div><div class="card-t">SSEID detail</div>
           <div class="card-s">As of ${sseid.meta?.as_of_date} · <span id="sseidCount"></span> shown</div></div>
    </div>
    <div class="search-row">
      <input type="text" id="srch" placeholder="Search SSEID or city…" oninput="filterTable()"/>
      <select id="tfil" onchange="filterTable()">
        <option value="">All tiers</option>
        ${TIER_ORDER.map(t=>`<option value="${t}"${tierFilter===t?" selected":""}>${t}</option>`).join("")}
      </select>
    </div>
    <div class="dtbl-wrap">
      <table class="dtbl">
        <thead><tr>
          <th style="width:200px">SSEID</th>
          <th style="width:130px">City</th>
          <th style="width:70px">Leads</th>
          <th style="width:70px">Orders</th>
          <th style="width:90px">Tier</th>
        </tr></thead>
        <tbody id="sseidBody"></tbody>
      </table>
    </div>
  </div>` : `<div class="card">No SSEID detail available.</div>`}
  `;

  document.getElementById("page").innerHTML =
    ({ exec: execHTML, trends: trendsHTML, cohort: cohortHTML, city: cityHTML, sseid: sseidHTML })[activeTab]
    || `<div class="err-box">Unknown tab "${activeTab}".</div>`;

  // Legend
  const leg = document.getElementById("leg");
  if (leg) activeTiers().forEach(t => {
    leg.innerHTML += `<span class="lc"><span class="ldot" style="background:${activeColor(t)}"></span>${t}</span>`;
  });

  // MoM bars — cohort-based: each bar's segments come from that month's own
  // held_base.curr, out of that SAME cohort's base_size. Widths and printed
  // %'s now agree exactly (both from the same fixed population), unlike the
  // previous ratio-based approach.
  const momBars = document.getElementById("momBars");
  if (momBars) {
    cohortMonths.forEach((mo, i) => {
      const hb = filterHeldBase(mo);
      const currB = bucketize(hb.curr);
      const pct = pctByMonth[i];
      if (!hb.base_size) return;
      const segs = activeTiers()
        .map(t => ({ t, c: currB[t]||0, p: pct[t].curr }))
        .filter(s => s.p > 0);
      momBars.innerHTML += `<div class="mom-row">
        <div class="mom-lbl">${mo.label}</div>
        <div class="mom-bar">${segs.map(s => {
          const label = s.p > 10 ? `${s.c.toLocaleString()} · ${s.p.toFixed(1)}%`
                      : s.p > 4  ? `${s.p.toFixed(1)}%`
                      : "";
          return `<div class="seg" title="${s.t}: ${s.c.toLocaleString()} (${s.p.toFixed(1)}%)"
               style="width:${s.p.toFixed(1)}%;background:${activeColor(s.t)}">${label}</div>`;
        }).join("")}</div>
        <div class="mom-tot">${hb.base_size.toLocaleString()}</div>
      </div>`;
    });
  }

  // Table 1: Cumulative — plain tier %/count of everyone commissioned to
  // date, per month. pp is a simple subtraction of adjacent columns' plain
  // %'s (this table makes no attempt to isolate new-signup dilution — that's
  // what tables 2 and 3 are for).
  const cumulativeTbody = document.getElementById("cumulativeTbody");
  if (cumulativeTbody) {
    const plainPctByMonth = mom.months.map(mo => {
      const bt = bucketize(filterMomMonth(mo));
      const tot = monthTotal(mo);
      const out = {};
      activeTiers().forEach(t => { out[t] = tot ? +((bt[t]||0)/tot*100).toFixed(2) : 0; });
      return out;
    });
    const countByMonth = mom.months.map(mo => bucketize(filterMomMonth(mo)));
    activeTiers().forEach(t => {
      const cells = mom.months.map((mo, i) => {
        const c = countByMonth[i][t] || 0;
        const pct = plainPctByMonth[i][t];
        if (i === 0) return numberMode === "abs" ? `<td>${c.toLocaleString()}</td>` : `<td>${pct.toFixed(1)}%</td>`;
        if (numberMode === "abs") {
          const absDelta = c - (countByMonth[i-1][t] || 0);
          const arrow = absDelta > 0 ? "▲" : absDelta < 0 ? "▼" : "–";
          return `<td class="${dirClass(absDelta)}">${c.toLocaleString()} <span class="pp-sub">(${arrow} ${Math.abs(absDelta).toLocaleString()})</span></td>`;
        }
        const pp = +(pct - plainPctByMonth[i-1][t]).toFixed(2);
        const arrow = pp > 0.05 ? "▲" : pp < -0.05 ? "▼" : "–";
        return `<td class="${dirClass(pp)}">${pct.toFixed(1)}% <span class="pp-sub">(${arrow} ${Math.abs(pp).toFixed(1)} pp)</span></td>`;
      }).join("");
      cumulativeTbody.innerHTML += `<tr>
        <td><span class="badge" style="background:${activeColor(t)};color:${badgeTextColor(t)}">${t}</span></td>
        ${cells}
      </tr>`;
    });
    const totalCells = mom.months.map(mo => `<td>${monthTotal(mo).toLocaleString()}</td>`).join("");
    cumulativeTbody.innerHTML += `<tr class="summary-row"><td>Total</td>${totalCells}</tr>`;
  }

  // Table 2: New customers — just this month's delta (this month's plain
  // count minus the pre-existing cohort's curr count), tiered as of this
  // same month's end. % is out of THAT month's own new-customer total.
  const newCustomersTbody = document.getElementById("newCustomersTbody");
  if (newCustomersTbody) {
    const deltaByMonth = cohortMonths.map(mo => {
      const fullB = bucketize(filterMomMonth(mo));
      const oldB = bucketize(filterHeldBase(mo).curr);
      const out = {};
      activeTiers().forEach(t => { out[t] = (fullB[t]||0) - (oldB[t]||0); });
      return out;
    });
    const newTotals = deltaByMonth.map(d => Object.values(d).reduce((s,v)=>s+v,0));
    activeTiers().forEach(t => {
      const cells = cohortMonths.map((mo, i) => {
        const c = deltaByMonth[i][t];
        if (numberMode === "abs") return `<td>${c.toLocaleString()}</td>`;
        const pct = newTotals[i] ? (c/newTotals[i]*100).toFixed(1) : "0.0";
        return `<td>${pct}%</td>`;
      }).join("");
      newCustomersTbody.innerHTML += `<tr>
        <td><span class="badge" style="background:${activeColor(t)};color:${badgeTextColor(t)}">${t}</span></td>
        ${cells}
      </tr>`;
    });
    const totalCells = newTotals.map(n => `<td>${n.toLocaleString()}</td>`).join("");
    newCustomersTbody.innerHTML += `<tr class="summary-row"><td>Total new</td>${totalCells}</tr>`;
  }

  // Tier table — cohort-based Count/Share (see latestCurrB/total above)
  const ttbody = document.getElementById("tierTbody");
  if (ttbody && latestCohort) {
    const latestPct = pctByMonth[pctByMonth.length - 1];
    activeTiers().forEach(t => {
      const c = latestCurrB[t] || 0;
      const sh = latestPct[t].curr.toFixed(1);
      const cond = t === "Metals" ? "Bronze + Silver + Gold + Platinum" : TIER_CONDITIONS[t];
      ttbody.innerHTML += `<tr>
        <td><span class="badge" style="background:${activeColor(t)};color:${badgeTextColor(t)}">${t}</span></td>
        <td>${c.toLocaleString()}</td><td>${sh}%</td>
        <td style="color:var(--mu);font-size:11px">${cond}</td>
      </tr>`;
    });
  }

  // City grid + City summary table — both driven by the latest cohort's
  // per-city breakdown (by_cluster_tier_curr), so numerator and denominator
  // are always the SAME fixed per-city population and segments sum to 100%.
  const cg = document.getElementById("cityGrid");
  const ctbody = document.getElementById("cityTbody");
  if ((cg || ctbody) && latestCohortMonth) {
    const hb = latestCohortMonth.held_base;

    // India row — nationwide cohort total, reusing latestCurrB/total from above
    // (always matches the Executive Summary tier breakdown exactly).
    if (ctbody) {
      const indiaCells = activeTiers().map(t => {
        const c = latestCurrB[t] || 0;
        const sh = total ? (c/total*100).toFixed(1) : "0.0";
        return `<td>${c.toLocaleString()} <span class="pp-sub">(${sh}%)</span></td>`;
      }).join("");
      ctbody.innerHTML += `<tr class="india-row"><td>India</td><td>${total.toLocaleString()}</td>${indiaCells}</tr>`;
    }

    const clusters = mom.meta.clusters || [];
    clusters.forEach(city => {
      const raw = {};
      TIER_ORDER.forEach(t => { raw[t] = hb.by_cluster_tier_curr?.[`${city}|${t}`] || 0; });
      const bt = bucketize(raw);
      const tot = Object.values(bt).reduce((s,v)=>s+v,0);
      if (!tot) return;

      if (cg) {
        const segs = activeTiers().filter(t=>bt[t]>0).map(t=>({ t, p: bt[t]/tot*100, c: bt[t] }));
        const non = activeTiers().filter(t=>t!=="Sticks").reduce((s,t)=>s+(bt[t]||0),0);
        cg.innerHTML += `<div class="city-card">
          <div class="city-name">${city} <span style="font-weight:400;color:var(--mu)">(${tot.toLocaleString()})</span></div>
          <div class="city-bar">${segs.map(s=>`<div style="width:${s.p.toFixed(1)}%;background:${activeColor(s.t)}" title="${s.t}: ${s.c}"></div>`).join("")}</div>
          <div class="city-stat">
            <span>Engaged: ${Math.round(non/tot*100)}%</span>
            <span>Sticks: ${(bt["Sticks"]||0).toLocaleString()}</span>
          </div>
        </div>`;
      }

      if (ctbody) {
        const cells = activeTiers().map(t => {
          const c = bt[t] || 0;
          const sh = tot ? (c/tot*100).toFixed(1) : "0.0";
          return `<td>${c.toLocaleString()} <span class="pp-sub">(${sh}%)</span></td>`;
        }).join("");
        ctbody.innerHTML += `<tr><td>${city}</td><td>${tot.toLocaleString()}</td>${cells}</tr>`;
      }
    });
  }

  // City tier trend chart — cohort-based %-share (pctByMonth already respects
  // the city filter via filterHeldBase), so it shows the trend for whichever
  // city is selected (or all cities combined if none is).
  const cityTrendCanvas = document.getElementById("cityTrendCanvas");
  if (cityTrendCanvas && cohortMonths.length) {
    const labels = cohortMonths.map(m => m.label);
    const datasets = activeTiers().map(t => ({
      label: t,
      data: pctByMonth.map(pct => pct[t].curr),
      borderColor: activeColor(t),
      backgroundColor: activeColor(t),
      tension: 0.3,
      pointRadius: 3,
    }));
    cityTrendChart = new Chart(cityTrendCanvas, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          y: { ticks: { callback: v => v + "%" }, grid: { color: "rgba(128,128,128,.15)" } },
          x: { grid: { display: false } },
        },
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
      },
    });
  }

  // Tier movement table — cohort-based; prev/curr/pp all come from the SAME
  // pctByMonth entry (self-contained per month), so no cross-month lookups needed.
  const tmTbody = document.getElementById("tierMovementTbody");
  if (tmTbody && cohortMonths.length) {
    const prevLabels = cohortMonths.map(m => mom.months[mom.months.indexOf(m) - 1]?.label);
    const article = w => /^[aeiou]/i.test(w) ? "an" : "a";

    activeTiers().forEach(t => {
      const cCurr = latestCurrB[t] || 0;
      const cells = pctByMonth.map((pct, i) => {
        const p = pct[t];
        const arrow = p.pp > 0.05 ? "▲" : p.pp < -0.05 ? "▼" : "–";
        const dir = p.pp > 0.05 ? "up" : p.pp < -0.05 ? "down" : "flat";
        const fav = favorability(t, p.pp);
        const tip = `${t} was ${p.prev.toFixed(1)}% of the cohort in ${prevLabels[i]}, `
          + `${dir} to ${p.curr.toFixed(1)}% in ${cohortMonths[i].label} `
          + `(${p.pp >= 0 ? "+" : ""}${p.pp.toFixed(1)} pp) — ${article(fav)} ${fav} for this tier.`;
        if (numberMode === "abs") {
          const absDelta = p.currCount - p.prevCount;
          const arrowA = absDelta > 0.5 ? "▲" : absDelta < -0.5 ? "▼" : "–";
          return `<td class="${dirClass(p.pp)}" title="${tip}">${p.prevCount.toLocaleString()}→${p.currCount.toLocaleString()} <span class="pp-sub">(${arrowA} ${Math.abs(absDelta).toLocaleString()})</span></td>`;
        }
        return `<td class="${dirClass(p.pp)}" title="${tip}">${p.prev.toFixed(1)}→${p.curr.toFixed(1)}% <span class="pp-sub">(${arrow} ${Math.abs(p.pp).toFixed(1)} pp)</span></td>`;
      }).join("");
      tmTbody.innerHTML += `<tr>
        <td><span class="badge" style="background:${activeColor(t)};color:${badgeTextColor(t)}">${t}</span></td>
        <td>${cCurr.toLocaleString()}</td>
        ${cells}
      </tr>`;
    });

    // Engaged row — valid as "100 − Sticks%" again here (unlike the previous
    // ratio-based approach), because within a cohort month every tier's %
    // genuinely does sum to 100% of that one fixed population.
    const engagedCells = pctByMonth.map((pct, i) => {
      const sticks = pct["Sticks"];
      const baseSize = filterHeldBase(cohortMonths[i]).base_size;
      const engCurr = +(100 - sticks.curr).toFixed(2);
      const engPrev = +(100 - sticks.prev).toFixed(2);
      const engPp = +(engCurr - engPrev).toFixed(2);
      const engCurrCount = baseSize - sticks.currCount;
      const engPrevCount = baseSize - sticks.prevCount;
      const arrow = engPp > 0.05 ? "▲" : engPp < -0.05 ? "▼" : "–";
      const dir = engPp > 0.05 ? "up" : engPp < -0.05 ? "down" : "flat";
      const tip = `Engaged (non-Sticks) was ${engPrev.toFixed(1)}% of the cohort in ${prevLabels[i]}, `
        + `${dir} to ${engCurr.toFixed(1)}% in ${cohortMonths[i].label} `
        + `(${engPp >= 0 ? "+" : ""}${engPp.toFixed(1)} pp) — more engagement is always favorable.`;
      if (numberMode === "abs") {
        const absDelta = engCurrCount - engPrevCount;
        const arrowA = absDelta > 0.5 ? "▲" : absDelta < -0.5 ? "▼" : "–";
        return `<td class="${dirClass(engPp)}" title="${tip}">${engPrevCount.toLocaleString()}→${engCurrCount.toLocaleString()} <span class="pp-sub">(${arrowA} ${Math.abs(absDelta).toLocaleString()})</span></td>`;
      }
      return `<td class="${dirClass(engPp)}" title="${tip}">${engPrev.toFixed(1)}→${engCurr.toFixed(1)}% <span class="pp-sub">(${arrow} ${Math.abs(engPp).toFixed(1)} pp)</span></td>`;
    }).join("");
    tmTbody.innerHTML += `<tr class="summary-row">
      <td>Engaged</td><td>${active.toLocaleString()}</td>
      ${engagedCells}
    </tr>`;

    // Sanity check: does the city-level breakdown sum back to the same
    // nationwide total shown in this table? Independent cross-check between
    // two separately-aggregated fields in tier_mom.json (by_tier_curr vs.
    // by_cluster_tier_curr) — not the same number computed twice, so a real
    // mismatch here would actually mean something's wrong upstream.
    const reconNote = document.getElementById("reconNote");
    if (reconNote && latestCohortMonth) {
      const hb = latestCohortMonth.held_base;
      const clusters = mom.meta.clusters || [];
      const seenClusters = new Set(clusters);
      const sumByTier = {};
      TIER_ORDER.forEach(t => sumByTier[t] = 0);
      Object.keys(hb.by_cluster_tier_curr || {}).forEach(k => {
        const idx = k.lastIndexOf("|");
        const t = k.slice(idx + 1);
        sumByTier[t] = (sumByTier[t] || 0) + hb.by_cluster_tier_curr[k];
      });
      const mismatches = TIER_ORDER.filter(t => sumByTier[t] !== (hb.by_tier_curr[t] || 0));
      const fullBLatest = bucketize(filterMomMonth(latestMonth));
      const oldBLatest = bucketize(latestCohort.curr);
      const newestTotal = activeTiers().reduce((s,t) => s + ((fullBLatest[t]||0) - (oldBLatest[t]||0)), 0);
      const existingTotal = latestCohort.base_size;
      const cumulativeTotal = monthTotal(latestMonth);
      reconNote.innerHTML = `
        <div class="recon ${mismatches.length ? "bad" : "ok"}">
          City-level tier counts sum to the same India-wide total shown above${mismatches.length ? ` — MISMATCH on ${mismatches.join(", ")}, check the source data` : ""}.
        </div>
        <div class="recon ok">
          Existing customers (<b>${existingTotal.toLocaleString()}</b>) + new this month (<b>${newestTotal.toLocaleString()}</b>) = ${latestMonth.label} cumulative total (<b>${cumulativeTotal.toLocaleString()}</b>).
        </div>`;
    }
  }

  // Tier movement trend chart
  const trendCanvas = document.getElementById("trendCanvas");
  if (trendCanvas && cohortMonths.length) {
    const labels = cohortMonths.map(m => m.label);
    const datasets = activeTiers().map(t => ({
      label: t,
      data: pctByMonth.map(pct => pct[t].curr),
      borderColor: activeColor(t),
      backgroundColor: activeColor(t),
      tension: 0.3,
      pointRadius: 3,
    }));
    trendChart = new Chart(trendCanvas, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          y: { ticks: { callback: v => v + "%" }, grid: { color: "rgba(128,128,128,.15)" } },
          x: { grid: { display: false } },
        },
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
      },
    });
  }

  // Tier-wise progress this month — from SSEID-level held-base detail,
  // grouped by baseline tier (tier_prev). "Given" = curr minus prev, i.e.
  // what that baseline cohort has done DURING this month specifically.
  const tierProgressTbody = document.getElementById("tierProgressTbody");
  if (tierProgressTbody) {
    TIER_ORDER.forEach(t => {
      const g = progressByTier[t];
      if (!g) return;
      const leadsGiven = g.leadsCurr - g.leadsPrev;
      const ordersGiven = g.ordersCurr - g.ordersPrev;
      const movedUp = g.count - g.stillSame;
      tierProgressTbody.innerHTML += `<tr>
        <td><span class="badge" style="background:${TIER_COLORS[t]};color:${badgeTextColor(t)}">${t}</span></td>
        <td>${g.count.toLocaleString()}</td>
        <td>${g.leadsPrev.toLocaleString()}</td><td>${g.leadsCurr.toLocaleString()}</td>
        <td class="${dirClass(leadsGiven)}">${leadsGiven >= 0 ? "+" : ""}${leadsGiven.toLocaleString()}</td>
        <td>${g.ordersPrev.toLocaleString()}</td><td>${g.ordersCurr.toLocaleString()}</td>
        <td class="${dirClass(ordersGiven)}">${ordersGiven >= 0 ? "+" : ""}${ordersGiven.toLocaleString()}</td>
        <td>${g.stillSame.toLocaleString()}</td>
        <td class="${movedUp > 0 ? "pp-inc" : "pp-flat"}" title="${movedUp.toLocaleString()} SSEID(s) that were ${t} as of ${hbPrevLabel} gave enough leads/orders during ${hbLabel} to move to a higher tier">${movedUp.toLocaleString()}</td>
      </tr>`;
    });
  }

  // City-wise progress this month — same held-base detail, grouped by city.
  const cityProgressTbody = document.getElementById("cityProgressTbody");
  if (cityProgressTbody) {
    Object.keys(progressByCity).sort().forEach(city => {
      const g = progressByCity[city];
      const leadsGiven = g.leadsCurr - g.leadsPrev;
      const ordersGiven = g.ordersCurr - g.ordersPrev;
      cityProgressTbody.innerHTML += `<tr>
        <td>${city}</td>
        <td>${g.count.toLocaleString()}</td>
        <td>${g.leadsPrev.toLocaleString()}</td><td>${g.leadsCurr.toLocaleString()}</td>
        <td class="${dirClass(leadsGiven)}">${leadsGiven >= 0 ? "+" : ""}${leadsGiven.toLocaleString()}</td>
        <td>${g.ordersPrev.toLocaleString()}</td><td>${g.ordersCurr.toLocaleString()}</td>
        <td class="${dirClass(ordersGiven)}">${ordersGiven >= 0 ? "+" : ""}${ordersGiven.toLocaleString()}</td>
      </tr>`;
    });
  }

  // ── Cohort Activation heatmap — grouped into era rows (one per fiscal
  // year), each with an aggregate rollup. Color scale is normalised to the
  // max activation % actually observed in the current segment+city slice,
  // so contrast stays meaningful whichever tier/city is selected.
  const cohortHmBody = document.getElementById("cohortHmBody");
  if (cohortHmBody && cohortLabels.length) {
    const eras = [];
    cohortLabels.forEach(c => {
      const era = cohortEra(c);
      let bucket = eras.find(e => e.era === era);
      if (!bucket) { bucket = { era, cohorts: [] }; eras.push(bucket); }
      bucket.cohorts.push(c);
    });

    let maxPct = 0;
    cohortLabels.forEach(c => {
      cohortActMonths.forEach(mo => {
        const cell = cohortGridData[c]?.[mo];
        if (cell && cell.pop > 0) maxPct = Math.max(maxPct, cell.act / cell.pop * 100);
      });
    });
    maxPct = maxPct || 1;

    const ncols = 2 + cohortActMonths.length;
    let html = "";
    eras.forEach(({ era, cohorts }) => {
      html += `<tr class="era-row"><td colspan="${ncols}">${era}</td></tr>`;
      cohorts.forEach(c => {
        html += `<tr><td class="rl">${c}</td><td class="sc">${(cohortSizeMap[c]||0).toLocaleString()}</td>`;
        cohortActMonths.forEach(mo => {
          const cell = cohortGridData[c]?.[mo];
          if (!cell || cell.pop === 0) { html += `<td style="color:var(--bd)">—</td>`; return; }
          const pct = cell.act / cell.pop * 100;
          const bg = cohortPctToHex(pct, maxPct), fg = cohortFgForBg(pct, maxPct);
          const noise = cell.pop < 30;
          const disp = cohortHmMode === "pct" ? pct.toFixed(1)+"%"
                     : cohortHmMode === "act" ? cell.act.toLocaleString()
                     : cell.pop.toLocaleString();
          const prevLabel = prevMonthLabelOf(mo);
          const engagedTillDate = cohortEngagedMap[c] || 0;
          const cohortSizeForTip = cohortSizeMap[c] || 0;
          const engagedPct = cohortSizeForTip ? (engagedTillDate / cohortSizeForTip * 100).toFixed(1) : "0.0";
          let tip = `${c} · ${mo}\nPool (this cell, ${cohortEffSeg}): ${cell.pop.toLocaleString()}`
                  + `\nEngaged till date (Metals, whole cohort): ${engagedTillDate.toLocaleString()} (${engagedPct}% of cohort size ${cohortSizeForTip.toLocaleString()})`
                  + `\nActivated: ${cell.act.toLocaleString()} (${pct.toFixed(1)}%)`;
          if (cohortMetaInfo.has_repeat_data && cell.act > 0) {
            const rPct = (cell.repeatAct / cell.act * 100).toFixed(0);
            tip += `\nAlso active in ${prevLabel}: ${cell.repeatAct.toLocaleString()} (${rPct}% of activated)`;
          }
          const tierBreakdown = Object.entries(cell.byTier)
            .filter(([,v]) => v.act > 0)
            .sort((a,b) => b[1].act - a[1].act);
          if (tierBreakdown.length > 1) {
            tip += `\nActivated by tier (baseline as of ${prevLabel} end):`;
            tierBreakdown.forEach(([t,v]) => { tip += `\n  ${t}: ${v.act.toLocaleString()}`; });
          }
          if ((cohortEffSeg === "Metals" || cohortEffSeg === "Combined") && cohortMetaInfo.has_prior_tier_data) {
            const ntm = newToMetalsData[c]?.[mo];
            if (ntm && ntm.total > 0) {
              tip += `\nNew to Metals this month: ${ntm.total.toLocaleString()}`
                   + ` (from Sticks: ${(ntm.Sticks||0).toLocaleString()}, from Stones: ${(ntm.Stones||0).toLocaleString()})`;
            }
          }
          if (noise) tip += `\n⚠ pool < 30`;
          html += `<td style="background:${bg};color:${fg}" title="${tip}">${disp}${noise ? '<span class="noise-flag"></span>' : ""}</td>`;
        });
        html += `</tr>`;
      });
      const monthTotals = cohortActMonths.map(mo => {
        let p = 0, a = 0;
        cohorts.forEach(c => { const cell = cohortGridData[c]?.[mo]; if (cell) { p += cell.pop; a += cell.act; } });
        return { p, a };
      });
      const eraSize = cohorts.reduce((s,c) => s + (cohortSizeMap[c]||0), 0);
      html += `<tr style="border-top:2px solid var(--bd);background:var(--bg)">`
            + `<td class="rl" style="font-size:11px;color:var(--mu);font-weight:500">↳ ${era} total</td>`
            + `<td class="sc" style="font-size:11px">${eraSize.toLocaleString()}</td>`;
      monthTotals.forEach(({ p, a }) => {
        if (!p) { html += `<td style="color:var(--bd)">—</td>`; return; }
        const pct = a / p * 100;
        const bg = cohortPctToHex(pct, maxPct), fg = cohortFgForBg(pct, maxPct);
        const disp = cohortHmMode === "pct" ? pct.toFixed(1)+"%" : cohortHmMode === "act" ? a.toLocaleString() : p.toLocaleString();
        html += `<td style="background:${bg};color:${fg};font-weight:700" title="${era} total — ${pct.toFixed(1)}% (${a}/${p})">${disp}</td>`;
      });
      html += `</tr>`;
    });
    cohortHmBody.innerHTML = html;

    const cohortLegend = document.getElementById("cohortLegend");
    if (cohortLegend) {
      let bar = "";
      for (let i = 0; i < 20; i++) bar += `<div style="flex:1;background:${cohortPctToHex(maxPct*i/19, maxPct)}"></div>`;
      cohortLegend.innerHTML = `<span>0%</span><div class="leg-bar">${bar}</div><span>${maxPct.toFixed(1)}%+</span>`
        + `<span style="margin-left:10px"><span class="noise-flag"></span> pool &lt; 30 SSEIDs</span>`;
    }
  }

  // Cohort trajectory toggles + line chart
  const cohortToggles = document.getElementById("cohortToggles");
  if (cohortToggles) {
    cohortToggles.innerHTML = cohortLabels.map((c, i) => {
      const on = cohortActiveCohorts.has(c);
      const col = `hsl(${Math.round(360*i/Math.max(cohortLabels.length,1))},60%,45%)`;
      return `<button class="ctog${on?" on":""}" style="${on?`background:${col};border-color:${col};color:#fff`:""}" onclick="toggleCohortLine('${c}')">${c}</button>`;
    }).join("");
  }
  const cohortLineCanvas = document.getElementById("cohortLineCanvas");
  if (cohortLineCanvas && cohortLabels.length) {
    const datasets = cohortLabels.filter(c => cohortActiveCohorts.has(c)).map(c => {
      const col = `hsl(${Math.round(360*cohortLabels.indexOf(c)/Math.max(cohortLabels.length,1))},60%,45%)`;
      return {
        label: c,
        data: cohortActMonths.map(mo => {
          const cell = cohortGridData[c]?.[mo];
          return cell && cell.pop > 0 ? +(cell.act/cell.pop*100).toFixed(2) : null;
        }),
        borderColor: col, backgroundColor: "transparent", borderWidth: 2,
        pointRadius: 3, tension: .35, fill: false, spanGaps: false,
      };
    });
    cohortLineChart = new Chart(cohortLineCanvas, {
      type: "line",
      data: { labels: cohortMoLabels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: datasets.length <= 12, position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } },
          tooltip: { callbacks: { label: ctx => ctx.raw !== null ? ` ${ctx.raw.toFixed(2)}% (${ctx.dataset.label})` : "" } },
        },
        scales: {
          y: { beginAtZero: true, ticks: { callback: v => v + "%" }, grid: { color: "rgba(128,128,128,.15)" } },
          x: { grid: { display: false } },
        },
      },
    });
  }

  // SSEID table
  window._currentRows = sseidRows;
  filterTable();
}

function filterTable() {
  const q  = (document.getElementById("srch")?.value || "").toLowerCase();
  const tf = document.getElementById("tfil")?.value || "";
  const rows = (window._currentRows || []).filter(r =>
    (!q  || (r.sseid||"").toLowerCase().includes(q) || (r.city||"").toLowerCase().includes(q)) &&
    (!tf || r.tier === tf)
  );
  const body = document.getElementById("sseidBody");
  const cnt  = document.getElementById("sseidCount");
  if (!body) return;
  if (cnt) cnt.textContent = rows.length.toLocaleString()+" rows";
  body.innerHTML = rows.slice(0, 1000).map(r => `<tr>
    <td style="font-family:monospace;font-size:11px">${r.sseid || "—"}</td>
    <td>${r.city || "—"}</td>
    <td>${r.leads}</td>
    <td>${r.orders}</td>
    <td><span class="badge" style="background:${TIER_COLORS[r.tier]||"#888"}">${r.tier}</span></td>
  </tr>`).join("") + (rows.length > 1000
    ? `<tr><td colspan="5" style="text-align:center;color:var(--mu);padding:8px">
         Showing 1,000 of ${rows.length.toLocaleString()} rows. Use filters or export CSV for full data.
       </td></tr>` : "");
}

function exportCSV() {
  const rows = window._filteredRows || window._currentRows || DATA.sseid?.records || [];
  if (!rows.length) { alert("No data to export. Load the dashboard first."); return; }
  const headers = ["SSEID","City","Leads Given","Orders Given","Tier"];
  const csv = [headers, ...rows.map(r => [r.sseid, r.city, r.leads, r.orders, r.tier])]
    .map(row => row.map(v => `"${(v||"").toString().replace(/"/g,'""')}"`).join(","))
    .join("\n");
  const a = document.createElement("a");
  a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
  a.download = `referral_tiers_${DATA.meta?.latest_end_date || new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

loadData();
</script>
</body>
</html>
